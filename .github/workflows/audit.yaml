name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: 22
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint
      
            - name: Type check
              run: npx tsc --noEmit
      
            - name: Test
              run: npm test

            
            

