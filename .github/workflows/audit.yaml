name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    audit:
        runs-on: ubuntu-20.04
        steps:
            - uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: 18
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Build
              run: npm run build
            
            

