<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt Tracker – Pricing</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px 16px;
    }

    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .header p  { color: #888; font-size: 15px; }

    .toggle {
      display: flex;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .toggle button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: #888;
    }
    .toggle button.active {
      background: #fff;
      color: #000;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
    }

    .badge {
      display: inline-block;
      background: #22c55e22;
      color: #22c55e;
      border: 1px solid #22c55e44;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .price { margin-bottom: 20px; }
    .price .amount { font-size: 42px; font-weight: 800; }
    .price .period { font-size: 16px; color: #888; margin-left: 4px; }
    .price .original {
      font-size: 14px;
      color: #555;
      text-decoration: line-through;
      margin-top: 4px;
    }

    .features { list-style: none; margin-bottom: 28px; }
    .features li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #ccc;
      padding: 6px 0;
    }
    .features li::before {
      content: '✓';
      color: #22c55e;
      font-weight: 700;
      font-size: 13px;
    }

    .pay-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .pay-btn:hover   { opacity: 0.88; }
    .pay-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .note { text-align: center; margin-top: 16px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const PLANS = {
      monthly: {
        label: 'Monthly',
        amount: 299,
        amountPaise: 29900,
        period: '/month',
        badge: null,
        original: null,
      },
      yearly: {
        label: 'Yearly',
        amount: 2499,
        amountPaise: 249900,
        period: '/year',
        badge: 'Save 30%',
        original: '₹3,588/year',
      },
    };

    const FEATURES = [
      'Unlimited receipt scans',
      'AI-powered data extraction',
      'Export to CSV & PDF',
      'Priority support',
    ];

    // ← point this to your deployed Vercel backend URL
    const API_BASE = '';

    function App() {
      const [billing, setBilling] = React.useState('monthly');
      const [loading, setLoading] = React.useState(false);
      const plan = PLANS[billing];

      async function handlePay() {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/payment/create-order`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ plan: billing }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to create order');

          const options = {
            key: data.keyId,
            amount: data.amount,
            currency: data.currency,
            name: 'Receipt Tracker',
            description: `${plan.label} Subscription`,
            order_id: data.orderId,
            handler: async function (response) {
              const verify = await fetch(`${API_BASE}/api/payment/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(response),
              });
              const result = await verify.json();
              if (result.success) {
                alert('Payment successful! Thank you.');
              } else {
                alert('Payment verification failed. Contact support.');
              }
            },
            theme: { color: '#ffffff' },
          };

          const rzp = new window.Razorpay(options);
          rzp.open();
        } catch (err) {
          alert(err.message);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="container">
          <div className="header">
            <h1>Simple Pricing</h1>
            <p>Start scanning receipts today</p>
          </div>

          <div className="toggle">
            <button className={billing === 'monthly' ? 'active' : ''} onClick={() => setBilling('monthly')}>Monthly</button>
            <button className={billing === 'yearly'  ? 'active' : ''} onClick={() => setBilling('yearly')}>Yearly</button>
          </div>

          <div className="card">
            {plan.badge && <span className="badge">{plan.badge}</span>}

            <div className="price">
              <span className="amount">₹{plan.amount.toLocaleString()}</span>
              <span className="period">{plan.period}</span>
              {plan.original && <div className="original">{plan.original}</div>}
            </div>

            <ul className="features">
              {FEATURES.map(f => <li key={f}>{f}</li>)}
            </ul>

            <button className="pay-btn" onClick={handlePay} disabled={loading}>
              {loading ? 'Processing…' : `Pay with Razorpay`}
            </button>
          </div>

          <p className="note">Secure payments powered by Razorpay</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
